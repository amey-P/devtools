[package]
name = "herdr-subagents-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
notify = "=8.2.2"
rmcp = { version = "=3.9.0", features = ["server", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "io-std", "sync"] }
tokio-util = "=0.7.20"

[dev-dependencies]
rmcp = { version = "=3.9.0", features = ["client", "transport-child-process"] }
tempfile = "=3.27.0"
